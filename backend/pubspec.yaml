name: backend
description: AI-Enhanced Project Management System — Dart Backend
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # HTTP server and routing
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5

  # MongoDB driver
  mongo_dart: ^0.10.4

  # Password hashing
  bcrypt: ^1.1.3

  # JWT authentication
  dart_jsonwebtoken: ^2.14.3

  # HTTP client (for AI API calls)
  http: ^1.2.2

  # Environment variables
  dotenv: ^4.2.0

  # Crypto utilities
  crypto: ^3.0.5

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.8
